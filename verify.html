<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background: #1a1a2e; color: white; font-family: Arial; text-align: center; padding: 20px;">
    <h2>🔍 Проверка безопасности</h2>
    <p id="status">Пожалуйста, подождите...</p>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        // Функция для получения IP через JSONP (обходит CORS)
        function getIPViaJSONP() {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                const callbackName = 'ipCallback_' + Date.now();
                
                window[callbackName] = function(data) {
                    const ip = data.ip || data.query;
                    if (ip && ip.match(/^\d+\.\d+\.\d+\.\d+$/)) {
                        resolve(ip);
                    } else {
                        reject(new Error('Invalid IP'));
                    }
                    delete window[callbackName];
                    document.body.removeChild(script);
                };
                
                script.src = 'https://api.ipify.org?format=jsonp&callback=' + callbackName;
                script.onerror = () => {
                    reject(new Error('JSONP failed'));
                    delete window[callbackName];
                    document.body.removeChild(script);
                };
                
                document.body.appendChild(script);
                
                setTimeout(() => {
                    reject(new Error('Timeout'));
                    delete window[callbackName];
                    document.body.removeChild(script);
                }, 5000);
            });
        }
        
        // Функция для получения IP через fetch
        async function getIPViaFetch() {
            const apis = [
                'https://api.ipify.org?format=json',
                'https://api.myip.com',
                'https://ipwho.is/'
            ];
            
            for (const api of apis) {
                try {
                    const response = await fetch(api);
                    const data = await response.json();
                    const ip = data.ip || data.query;
                    
                    if (ip && ip.match(/^\d+\.\d+\.\d+\.\d+$/)) {
                        return ip;
                    }
                } catch (e) {
                    console.log('Fetch failed for', api);
                }
            }
            
            throw new Error('All fetch failed');
        }
        
        // Главная функция
        async function main() {
            let ip = null;
            
            // Пробуем получить IP
            try {
                ip = await getIPViaJSONP();
            } catch (e) {
                console.log('JSONP failed, trying fetch...');
                try {
                    ip = await getIPViaFetch();
                } catch (e2) {
                    console.log('All methods failed');
                }
            }
            
            if (ip) {
                document.getElementById('status').innerHTML = 
                    '✅ IP: <strong>' + ip + '</strong>';
                
                // Отправляем IP в Telegram
                tg.sendData(ip);
                
                // Ждем 2 секунды перед закрытием (важно!)
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                // Закрываем WebApp
                tg.close();
            } else {
                document.getElementById('status').innerHTML = 
                    '❌ Не удалось получить IP';
                
                // Отправляем ошибку
                tg.sendData('error');
                
                // Ждем и закрываем
                await new Promise(resolve => setTimeout(resolve, 2000));
                tg.close();
            }
        }
        
        // Запускаем
        main();
    </script>
</body>
</html>
