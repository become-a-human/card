<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h2>🔍 Проверка</h2>
    <p id="status">Получение IP...</p>
    
    <script>
        Telegram.WebApp.ready();
        document.getElementById('status').innerText = 'WebApp готов';
        
        fetch('https://api.ipify.org?format=json')
            .then(r => r.json())
            .then(data => {
                document.getElementById('status').innerText = 'IP: ' + data.ip;
                
                // Отправляем
                Telegram.WebApp.sendData(data.ip);
                document.getElementById('status').innerText += '\nОтправлено!';
                
                setTimeout(() => {
                    Telegram.WebApp.close();
                }, 1000);
            })
            .catch(e => {
                document.getElementById('status').innerText = 'Ошибка: ' + e.message;
                Telegram.WebApp.sendData('error');
                Telegram.WebApp.close();
            });
    </script>
</body>
</html>
